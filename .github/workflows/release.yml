name: Build and Release VonSEOWP

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v2.1.0, v3.0, etc.
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install Dependencies
        run: npm install # Ensures package.json environment is ready

      - name: Run Regression Tests
        run: |
          npm run test:analyzer
          npm run test:frontend-meta
          npm run test:security
          npm run test:columns-score
          npm run test:site-audit
          npm run test:toc
          npm run test:robots
          npm run test:toc-toggle

      - name: Lint Packaged PHP
        run: |
          find includes admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l vonseo.php
          php -l uninstall.php
          php -l index.php

      - name: Run Build Script
        run: npm run release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vonseo-v*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
